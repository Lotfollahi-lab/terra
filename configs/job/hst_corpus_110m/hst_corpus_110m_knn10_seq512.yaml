# All keys in this YAML file must be in capital letters since
# they will be treated as environmental variables.
#
# hst_corpus_110m, re-tokenized 16 x 512 compact corpus, model layout
# 10 neighbours x 512 genes. Submit with scripts/bsub_submit_tiger.sh <this file>.
# The model config's batch size (54 per GPU), LR, EMA, weight decay and
# checkpoint_freq_iter are set for NUM_NODES x NUM_GPUS_NODE = 16 GPUs: change
# them together (the model config lists the 32-GPU values). TERRA-96M trained
# on 32 GPUs.

job_requirement:
  LSB_DEFAULT_USERGROUP: team361  # The user group to be used for scheduling the job.
  QUEUE: "training-parallel" # "gpu-lotfollahi", "gpu-lotfollahi-train"  # The job queue to be used for scheduling the job.
  NUM_NODES: 2  # Number of compute nodes required for the job.
  NUM_GPUS_NODE: 8  # Number of GPUs per node.
  NUM_PROCESSES_NODE: 64  # Number of processes per node.
  MEM_NODE: 1024  # Memory allocated per node (in GB).

infiniband:
  NCCL_IB_DISABLE: 0  # 1: Disable InfiniBand, 0: Enable InfiniBand

environment:
  ENV_PATH: "${TERRA_ENV_PATH}"  # Path to the environment to be activated.

artifact:
  ARTIFACT_LOCATION: "${TERRA_ARTIFACTS_DIR}/hst_corpus_110m"  # Path to store the artifacts.
  WAREHOUSE_PATH: "${TERRA_ARTIFACTS_DIR}/hst_corpus_110m"  # Path to store the artifacts.
  OUTPUT_DIR: "${TERRA_ARTIFACTS_DIR}/hst_corpus_110m"  # Path to store the artifacts.
  LOG_DIR: "${TERRA_ARTIFACTS_DIR}/hst_corpus_110m"
  EXPERIMENT_NAME: "terra_pretraining"  # Name of the experiment.
  RUN_NAME: "hst_corpus_110m_knn10_seq512_r5_run_1"  # Name of the run (also the wandb run id with EXPERIMENT_NAME).

runner_script:
  RUNNER_SCRIPT: "${TERRA_REPO_DIR}/scripts/train_model_lsf_mpirun_sanger.sh"  # Path to the runner script.
  TRAINING_SCRIPT_PATH: "${TERRA_REPO_DIR}/src/terra/training/main.py"  # Path to the training script.
  BACKEND: "nccl"  # Backend for distributed training.
  CONFIG_FILE: "${TERRA_REPO_DIR}/configs/model/hst_corpus_110m/hst_corpus_110m_knn10_seq512.yaml"
