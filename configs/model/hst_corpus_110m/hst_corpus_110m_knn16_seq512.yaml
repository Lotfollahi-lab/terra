# ==============================================================================
# TERRA pretraining on the re-tokenized hst_corpus_110m, model layout
# 16 neighbours x 512 genes per cell (8704 tokens), read from the corpus of
# 16 neighbours x 512 genes per cell in the compact storage format.
#
# - Needs TERRA with compact tokenized datasets (branch
#   feat/compact-tokenized-data); TERRA dev 7179a03 refuses compact rows.
# - Recipe: the round-5 suggested retrain config (rebuttal/
#   code_review_2026-11-11/REPORT.md section 4) with TERRA-96M's
#   special_tokens [] and cell_pos_enc coord.
# - Job config: configs/job/hst_corpus_110m/hst_corpus_110m_knn16_seq512.yaml
#   (16 GPUs: 2 nodes x 8). Batch size, LR, EMA, weight decay and
#   checkpoint_freq_iter below are set for 16 GPUs; change them together
#   with the GPU count.
#
# OPEN RECIPE DECISIONS (the values below are defaults, not decisions):
# 1. Metatokens: [] as TERRA-96M. Alternative (round 5): ['assay'] with
#    mask.special_token_pad_ratio 0.3 (the flagship hst_corpus_110m.yaml
#    also sets data.nz_spc and meta.new_spc true with metatokens; they
#    change how metatokens are encoded). Never 'batch' (round-5 F-2, F-7)
#    or 'gene_panel' (round-4 A-1).
# 2. Batch size: 35 per GPU, global 560 on 16 GPUs. ESTIMATE from
#    CPU-measured activation memory (devaudit/overnight/seq512/SEQ512.md 4):
#    the memory fraction of TERRA-96M's 144 per GPU at 10 x 256, with every
#    segment full, mask ratio 0.6 and padded masks; not measured on a
#    GPU. Pilot first: one step at this batch on one 80 GB GPU,
#    torch.cuda.max_memory_allocated(); raise the batch if far below 80 GB.
#    With mask ratio 0.8 (item 7) the same estimate gives 44 per GPU.
# 3. LR and EMA: rescaled from TERRA-96M (global 4608, lr 6e-5,
#    ema [0.9995, 1.0]) to global 560: lr = 6e-5 * sqrt(r),
#    1 - ema0 = 0.0005 * r, r = global / 4608 (square-root rule; same EMA
#    horizon in samples). On 32 GPUs (4 nodes): global 1120, lr 2.96e-05,
#    ema [0.999878, 1.0], weight decay 0.0197 -> 0.197,
#    checkpoint_freq_iter 20571.
#    Unscaled alternative: lr 6e-5, ema [0.9995, 1.0]. Heuristics; pilot
#    (round-5 P3).
# 4. Weight decay: TERRA-96M's 0.04 -> 0.4 (I-JEPA default, round 5), times
#    sqrt(r) to keep sum(lr * wd) over the run. Alternatives: 0.04 -> 0.4
#    unscaled, or 0.4 -> 4.0 (TERRA-112M). Pilot (round-5 F-R4).
# 5. Warmup: 0.25 epoch (round 5; gradient clipping is off during warmup).
#    TERRA-96M: 1 epoch.
# 6. Epochs: 5. About 171k steps per epoch on 16 GPUs (96M
#    training cells assumed; the new split decides), 8.2x the
#    steps of TERRA-96M's 5 epochs. Wall-clock time per step is unmeasured.
# 7. Mask ratio 0.6 (round 5, TERRA-112M); TERRA-96M used 0.8.
# 8. Count encoding value_bins with 20 bins (round 5, TERRA-112M); TERRA-96M
#    used mlp.
# 9. mask.min_context_genes 1 (round 5): every cell keeps a context gene;
#    changes results relative to the released models.
# 10. Release epoch: pre-register the rule (round 5, section 2), e.g. the
#    final epoch, or the best epoch on labelled batches in no reported
#    benchmark. test_model_checkpoint.py scores the corpus validation
#    batches, which are zero-shot benchmark batches.
# 11. Held-out batches: val_batch_ids / test_batch_ids are the 32 + 187 ids
#    of terra-reproducibility analysis/data_preparation/heldout_batch_ids.py
#    (last changed in 19bf480e; the same on dev 3fb1e380), so train()'s
#    held-out scan (datasets/utils.py _check_split_excludes_heldout) covers
#    all 219 ids. They include 75_batch0-3 (shp75-4b_1p), which TERRA-96M
#    trained on: a user decision, the lists are not changed here. A
#    TERRA-112M-style run on all cells uses ..._precomputed_split_full.pkl
#    (split_dataset.py --full_dataset) and no val/test lists.
#
# Corpus keys (must match terra_tokenizer_params.json of the corpus; train()
# raises otherwise, src/terra/tokenizers/params.py reconcile_tokenizer_params):
# - tokenized_seq_len_cell: 512 is the corpus stride. Without it, a model
#   with seq_len_cell 256 misreads the rows silently on dev; this branch
#   raises (params.py _layout_mismatches).
# - No precomputed_n_nonzero_tokens: compact rows give the lengths of the
#   layout read when the dataset loads (datasets/cell_datasets.py:178-196,
#   compact.layout_n_nonzero_tokens); train.py treats the key as optional.
# - model_input_size / n_neighs are the CORPUS layout (16 neighbours, rows of
#   17 x 512 = 8704 entries) in every hst_corpus_110m_knn* config, also for
#   models that read fewer neighbours or genes. Training does not read them
#   (train() warns when they differ from the record). Inference tokenizes new
#   data with them and reads the rows with tokenized_seq_len_cell /
#   truncate_neighbors as training reads the corpus rows
#   (inference/embed.py _truncation_settings), so new data give the inputs
#   the corpus rows give. With the model layout (e.g. 10 / 2816) inference
#   would build a fresh 10-NN graph, whose neighbours differ from the first
#   10 of the corpus' 16-NN graph when neighbour distances tie (duplicate
#   coordinates, grids; rehearsal 2026-11-21: 9 of 120 cells of 23_batch0).
# - zero_expr_from_raw_counts, gcrd_*, seurat_loess_span: the tokenizer
#   defaults (cell_tokenizers.py:373-376), which the corpus tokenizer configs
#   keep; stated so that inference (inference/tokenize.py TOKENIZER_CONFIG_KEYS)
#   and the record check use them explicitly. include_zero_expr_genes (false)
#   is recorded but not checked; aggregate_own_neighbors is cell_neigh only.
# - norm_factor_file_path: the file the corpus was tokenized with (tie-break
#   key tie_break_mean); its sha256 must equal the record's, and train()
#   copies it into the run folder. No pf_targets_file_path (shifted_log).
# - precomputed_split: written by split_dataset.py with
#   --tokenizer_folder_path $TERRA_DATA_DIR/tokenizer (its default is
#   /nfs/team361/sb75/DATASETS/tokenizer); it records the held-out ids it
#   excludes, so train() skips the cell-id scan when they cover both lists.
# - The protein_init and special_token_correction sections are absent, i.e.
#   off.
# ==============================================================================
seed: 0
data:
  dataset_name: 'hst_corpus_110m'
  tokenizer_type: 'cell_graph'
  model_input_size: 8704 # corpus layout (16 + 1) x 512, read as 17 x 512 (see 'Corpus keys')
  n_neighs: 16 # corpus layout; the model reads n_segments - 1 = 16 neighbours
  seq_len_cell: 512
  seq_len_neighborhood: 8192 # (n_segments - 1) * seq_len_cell
  n_segments: 17 # the cell + the neighbours the model reads
  tokenized_seq_len_cell: 512 # corpus stride (16 x 512 corpus)
  truncate_neighbors: false # all 16 neighbours of the corpus
  rank_cell_norm_method: null
  rank_gene_norm_method: null
  rank_count_norm_method: null
  count_cell_norm_method: null
  count_gene_norm_method: null
  count_count_norm_method: 'shifted_log'
  stable_rank_ties: true
  rank_tie_break_norm_factor: 'tie_break_mean'
  eliminate_stored_zeros: true
  pad_empty_neighbors: true
  zero_expr_from_raw_counts: false # tokenizer default
  gcrd_basis_target_read_depth: 153.4768 # tokenizer default (unused with shifted_log)
  gcrd_target_read_depth_per_gene: 0.0487 # tokenizer default (unused with shifted_log)
  seurat_loess_span: 0.75 # tokenizer default (unused with shifted_log)
  raw_data_folder_path: '${TERRA_DATA_DIR}/silver/hst_corpus_110m'
  token_dict_folder_path: '${TERRA_DATA_DIR}/tokenizer/token_dictionary_homo_sapiens.pkl'
  tokenized_data_folder_path: '${TERRA_DATA_DIR}/gold/cell-graph-tokenizer/hst_corpus_110m/hst_corpus_110m_32_None_None_None_None_None_shifted_log_knn_16_8704.dataset'
  norm_factor_file_path: '/nfs/team361/sb75/terra-reproducibility/artifacts/data/hst_corpus_110m/hst_corpus_110m_train_norm_factors.csv'
  precomputed_split: '${TERRA_DATA_DIR}/tokenizer/hst_corpus_110m_32_None_None_None_None_None_shifted_log_knn_16_8704_precomputed_split_train.pkl'
  sampling_strategy: null
  batch_size: 35 # per GPU; ESTIMATE, see item 2 above
  num_workers: 16
  pin_memory: True
  sep_gene_tokens_neb: False
  use_sampler: True
  n_special_values: 1000
  nz_spc: False
  mega_batch_mult_max: 1000
  val_batch_ids: [
    '49_batch0', '1000_batch11', '1000_batch19', '1000_batch32', '1007_batch1', '1007_batch14', '1002_batch3',
    '1002_batch15', '1002_batch27', '59_batch0', '59_batch6', '59_batch7', '59_batch4', '59_batch1',
