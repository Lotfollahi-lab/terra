meta:
  api_version: 'v3'
  add_cls: False
  gt_type: 'combined'
  count_encoding: 'value_bins'
  n_value_bins: 20
  cell_pos_enc: 'coord'
  enc_depth: 12
  enc_emb_dim: 384
  pred_depth: 12
  pred_emb_dim: 192
  num_heads: 6
  mlp_ratio: 4
  special_tokens: []
  pos_learnable: False
  use_bfloat16: True
  use_flash_attention: True
  attention_backend: flash # in effect the kernels of 'torch' (how TERRA-96M/112M trained): flash unmasked, memory-efficient masked (models/modules.py:27-59)
  use_layer_norm: True
  predict_gene: True
  new_spc: False
  excl_spc_from_loss: True
  target_enc_layer_norm: True
  mlp_bias: True
  zero_fully_masked_attention_rows: True # required with padded masks and no metatokens
mask:
  n_contexts: 1
  n_targets: 1
  block_masking: True
  cell_masking: False
  targets_list: null
  context_mask_size: 200 # unused with block masking
  target_mask_size: 50 # unused with block masking
  per_block_mask_ratio: 0.6
  sample_segments: True
  special_token_pad_ratio: 0.0 # no metatokens
  restrict_special_attention: False
  pad_masks_to_batch_max: True
  min_context_genes: 1
optimization:
  warmup: 0.25
  epochs: 5
  ema:
  - 0.999939
  - 1.0
  start_lr: 1.0e-06
  lr: 2.09e-05
  final_lr: 1.0e-06
  weight_decay: 0.0139
  final_weight_decay: 0.139
  ipe_scale: 1.0
  clip_grad: 2.0
  lambda_var: 0.
  lambda_cov: 0.
state:
  log_freq: 20
  checkpoint_freq: 1
  # Mid-epoch checkpoints every 5000 * 4608 / global batch = 41143 iterations
  # (global 560 on 16 GPUs; 20571 on 32 GPUs): TERRA-96M's spacing of
  # 23.04M training cells, i.e. 4 mid-epoch + 1 end-of-epoch checkpoints
  # per epoch with 96M training cells (5000 gave 35 per epoch,
  # 175 files of about 0.6 GB per run). Rescale it with the batch size or GPU
  # count. A run resumed from a mid-epoch checkpoint restarts that epoch
  # (utils/helper.py load_checkpoint), so this does not change what a
  # resume repeats.
  checkpoint_freq_iter: 41143
  write_tag: terra
  folder_path: null # new timestamped run folder; to resume, set it to that folder (absolute) and load_checkpoint: True
  load_checkpoint: False
  read_checkpoint: null
